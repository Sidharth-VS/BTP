# Coordinator Service Configuration
server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

flower:
  server_address: "0.0.0.0:9091"
  num_rounds: 9223372036854775807 # effectively run forever (sys.maxsize)
  min_available_clients: 1
  min_fit_clients: 1

api:
  api_key: "fedrag-dev-key"  # Override via env: API_KEY
  rate_limit_per_minute: 100

synthesis:
  ollama_url: "http://localhost:11434"
  ollama_model: "llama3.2"
  max_context_chars: 4000
  timeout_seconds: 30

# TASR Hyperparameters (per arXiv:2605.28112)
tasr:
  defense_mode: "rel_cons_agr"  # "rel_cons_agr", "rel_cons", or "none"
  decay_factor: 0.9             # γ: decay when feedback < median
  recovery_factor: 1.1111       # γ_rec: recover when feedback >= median. Kept at ~1/decay
                                # so a node that lands above the median as often as below
                                # it neither gains nor erodes; 1.02 ratcheted every node
                                # monotonically down to min_reputation.
  min_reputation: 0.1           # floor for trust variables
  warmup_queries: 5            # queries before trust updates kick in
  cold_start_s0: 0.7            # s_0: initial cold-start factor
  cold_start_tau: 30.0          # τ_s: warmup queries for cold-start ramp
  alpha_r: 1.0                  # exponent for u_rel
  alpha_c: 1.0                  # exponent for u_cons (via g)
  alpha_a: 0.5                  # exponent for u_agr (via g)
  delta_c: 0.0                  # δ_c: floor for g(u_cons). f_cons is the evidence-vs-declared
                                # -centroid check that catches a node returning evidence
                                # inconsistent with the profile it claimed. A 0.3 floor kept a
                                # fully-inconsistent node (u_cons=0.1) at 37% weight, which was
                                # enough for the malicious node to outrank honest peers.
  delta_a: 0.0                  # δ_a: floor for g(u_agr)
  docs_for_feedback: 5          # top-K docs used for feedback computation
  min_query_affinity: 0.0       # Clients whose declared-domain cosine affinity for the query
                                # is below this are excluded from the trust update, so they are
                                # not penalised for out-of-domain evidence. Do NOT enable on its
                                # own: excluding clients shrinks the scored cohort toward the
                                # attacker alone on its target domain, and the median then
                                # compares it against itself, so it never decays. Measured with
                                # the gate at 0.2: honest erosion stopped (u_rel 0.42 -> 0.98)
                                # but the attacker's tau ratio rose to 0.52 and it ranked #1 on
                                # 39/69 queries instead of 9/69. Pair it with an absolute
                                # (threshold_mode: fixed) threshold before enabling.
                                # 0 disables the gate.
  explore_interval: 20          # every N queries, add random extra node
  explore_extra: 1              # number of extra nodes for exploration
  fixed_threshold: null         # if set, use fixed threshold instead of median
  k_route: 3                     # default routing fan-out; override via env K_ROUTE

trust_db:
  path: "./trust_scores.db"     # SQLite database for trust persistence

# Hardware Attestation & Sybil Defense
attestation:
  enabled: true
  max_nodes_per_host: 20
  freshness_window_seconds: 3000
  storage_path: "workspace/coordinator/attestation_registry.json"
  # Aggregate admission/registration latency values (count/mean/std/min/max),
  # rewritten on every sample. Set to null to disable the snapshot.
  latency_storage_path: "workspace/coordinator/latency_metrics.json"
