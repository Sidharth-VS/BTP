services:
  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: fedrag-coordinator
    ports:
    - ${COORDINATOR_PORT:-8000}:8000
    - ${FLOWER_PORT:-9091}:9091
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ./workspace/coordinator:/workspace/coordinator
    - ./coordinator:/app/coordinator
    - ./coordinator/config.yaml:/app/coordinator/config.yaml:ro
    - ./shared:/app/shared
    environment:
    - COORDINATOR_CONFIG=/app/coordinator/config.yaml
    - API_KEY=${API_KEY:-fedrag-dev-key}
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    - OMP_NUM_THREADS=2
    - OPENBLAS_NUM_THREADS=2
    - MKL_NUM_THREADS=2
    - VECLIB_MAXIMUM_THREADS=2
    - NUMEXPR_NUM_THREADS=2
    deploy:
      resources:
        limits:
          cpus: '2.0'
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      fedrag-net:
        aliases:
        - coordinator
        - fedrag-coordinator
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fedrag-frontend
    ports:
    - 8501:8501
    volumes:
    - ./frontend:/app
    environment:
    - COORDINATOR_API_URL=${COORDINATOR_API_URL:-http://fedrag-coordinator:8000/api/v1/query}
    - API_KEY=${API_KEY:-fedrag-dev-key}
    deploy:
      resources:
        limits:
          cpus: '1.0'
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
    - fedrag-net
  node-1:
    build:
      context: .
      dockerfile: nodes/Dockerfile
    image: fedrag-node:latest
    container_name: fedrag-node-1
    environment:
    - NODE_ID=node-1
    - NODES_CONFIG=/app/nodes/nodes.yaml
    - API_KEY=${API_KEY:-fedrag-dev-key}
    - OMP_NUM_THREADS=2
    - OPENBLAS_NUM_THREADS=2
    - MKL_NUM_THREADS=2
    - VECLIB_MAXIMUM_THREADS=2
    - NUMEXPR_NUM_THREADS=2
    deploy:
      resources:
        limits:
          cpus: '1.9'
    volumes:
    - ./workspace/chroma/node-1:/workspace/chroma/node-1
    - ./workspace/data/node-1:/workspace/data/node-1:ro
    - ./nodes/app:/app/nodes/app:ro
    - ./shared:/app/shared
    - ./nodes/nodes.yaml:/app/nodes/nodes.yaml:ro
    - /etc/machine-id:/host/etc/machine-id:ro
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
    - fedrag-net
  node-2:
