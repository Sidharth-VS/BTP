[tool.poetry]
name = "fedrag"
version = "0.1.0"
description = "Federated RAG System with TASR Routing"
authors = ["Your Name <you@example.com>"]
packages = [
    { include = "shared" },
    { include = "coordinator", from = "." },
    { include = "nodes", from = "." }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
flwr = "^1.8.0"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
chromadb = "^0.5.0"
langchain = "^0.2.0"
langchain-community = "^0.2.0"
sentence-transformers = "^3.0.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
ollama = "^0.2.1"
numpy = "^1.26.0"
pyyaml = "^6.0.1"
httpx = "^0.27.0"
onnxruntime = "<1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"